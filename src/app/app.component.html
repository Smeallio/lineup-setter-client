<div class="container">
  <app-header></app-header>
  <div class="container__roster-position">
    <app-roster></app-roster>
    <app-positions></app-positions>
  </div>
  <app-lineup></app-lineup>
</div>

@if (confirmService.request(); as req) {
<app-confirm
  [message]="req.message"
  (confirmed)="confirmService.respond(true)"
  (cancelled)="confirmService.respond(false)"
/>
}
