<div class="playerList">
  <h3 class="playerList__title">Roster:</h3>
  <ol>
    @for (player of playerService.players(); track player.id) {
    <div class="playerList__list-row">
      <li>
        <span class="playerList__list-name">{{ player.name }}</span>
        <button
          class="playerList__list-delete-btn"
          (click)="onDeletePlayer(player.id)"
          aria-label="Close"
        >
          &times;
        </button>
      </li>
    </div>
    }
  </ol>
</div>
@if (showAddPlayer()) {
<form
  class="addPlayer__form"
  [formGroup]="newPlayerForm"
  (ngSubmit)="onAddPlayer()"
>
  <div class="addPlayer__form-name">
    <label class="addPlayer__form-label" for="playerName">Player Name:</label>
    <input
      class="addPlayer__form-input"
      id="playerName"
      formControlName="playerName"
    />
    @if (newPlayerForm.get('name')?.invalid &&
    newPlayerForm.get('name')?.touched) {
    <div>Player name is required.</div>
    }
  </div>
  <div class="addPlayer__form-btns">
    <button
      class="addPlayer__form-btn-add"
      type="submit"
      [disabled]="newPlayerForm.invalid"
    >
      Add Player
    </button>
    <button class="addPlayer__form-btn-cancel" (click)="toggleAddPlayerForm()">
      Cancel
    </button>
  </div>
</form>
} @else {
<button class="addPlayer__btn" (click)="toggleAddPlayerForm()">
  Add Player
</button>
}
